name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Glacier.Rag.slnx

    - name: Build
      run: dotnet build Glacier.Rag.slnx -c Release --no-restore

    - name: Test
      run: dotnet test Glacier.Rag.slnx -c Release --no-build --verbosity normal
